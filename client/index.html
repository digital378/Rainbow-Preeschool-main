    <title>Preschool in Thane | Rainbow Preschool International</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />

    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="canonical" href="https://www.rainbowpreschools.com/" />
    
    <!-- Preconnect to critical third-party domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.googletagmanager.com">
    
    <!-- DNS Prefetch for analytics (less critical) -->
    <link rel="dns-prefetch" href="https://connect.facebook.net">
    <link rel="dns-prefetch" href="https://www.clarity.ms">
    
    <!-- Fonts: display=swap shows a system fallback immediately and swaps to
         the web font once it arrives. The @font-face metric overrides in
         index.css are tuned so the fallback (Arial Bold) is dimensionally
         identical to Poppins, keeping CLS near zero while the swap is visible.
         Poppins 800 is loaded because the hero uses font-extrabold.
         The woff2 preload below fetches the Poppins 700 Latin file directly
         so it arrives in the same network round-trip as the CSS, eliminating
         the two-hop delay (CSS → then font) that caused swap-visible CLS. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/poppins/v24/pxiByp8kv8JHgFVrLCz7Z1xlFd2JQEk.woff2">
    <!-- Above-fold fonts only (Inter + Poppins). Fredoka is decorative/below-fold — loaded deferred via loadAnalytics() -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700;800&display=swap"></noscript>
    
    <!-- Only the home route uses this LCP image. Insert its responsive preload
         synchronously in the head so other routes never request the hero. -->
    <script>
      if (window.location.pathname === "/") {
        var heroPreload = document.createElement("link");
        heroPreload.rel = "preload";
        heroPreload.as = "image";
        heroPreload.href = "/images/optimized/hero-banner-1.webp";
        heroPreload.setAttribute("fetchpriority", "high");
        heroPreload.setAttribute("imagesrcset", "/images/optimized/hero-banner-1-480w.webp 480w, /images/optimized/hero-banner-1-640w.webp 640w, /images/optimized/hero-banner-1-828w.webp 828w, /images/optimized/hero-banner-1.webp 1200w");
        heroPreload.setAttribute("imagesizes", "100vw");
        document.head.appendChild(heroPreload);
      }
    </script>
    
    <!-- Inline critical CSS for instant first paint + static LCP hero -->
    <style>
      html,body{margin:0;padding:0;background:#1a1a1a;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif}
      #root{min-height:100vh;position:relative;z-index:1}
      #static-lcp-hero{position:absolute;top:0;left:0;right:0;height:100vh;min-height:560px;max-height:900px;overflow:hidden;z-index:0;pointer-events:none;background:#1a1a1a;contain:layout paint}
      #static-lcp-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
      #static-lcp-hero .ov1{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.65),rgba(0,0,0,.35) 40%,rgba(0,0,0,.10))}
      #static-lcp-hero .ov2{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.50),transparent 50%)}
    </style>
    
    <!-- GTM REMOVED - was causing duplicate events. Using direct gtag tracking instead -->
    
    <!-- Defer analytics loading until after page load for better FCP/LCP -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      function gtagSendEvent(url) {
        var callback = function () {
          if (typeof url === 'string') {
            window.location = url;
          }
        };
        gtag('event', 'conversion_event_submit_lead_form', {
          'event_callback': callback,
          'event_timeout': 2000,
        });
        return false;
      }
      
      // Load analytics after page is idle — with interaction fallback to avoid losing fast-bounce tracking
      var analyticsLoaded = false;
      function scheduleAnalytics() {
        if (analyticsLoaded) return;
        analyticsLoaded = true;
        loadAnalytics();
      }
      function setupAnalyticsSchedule() {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(scheduleAnalytics, { timeout: 3500 });
        } else {
          setTimeout(scheduleAnalytics, 1500);
        }
        // Also load on first user interaction to avoid missing fast-bounce events
        ['pointerdown','keydown','touchstart','scroll'].forEach(function(evt) {
          document.addEventListener(evt, scheduleAnalytics, { once: true, passive: true, capture: true });
        });
      }
      if (document.readyState === 'complete') {
        setupAnalyticsSchedule();
      } else {
        window.addEventListener('load', setupAnalyticsSchedule);
      }
      
      function loadAnalytics() {
        // Pre-configure GA4 so GTM's GA4 tag never fires an automatic page_view.
        // React SPA calls trackPageView() with the correct title after each navigation.
        gtag('config', 'G-G1MX1N0M05', { send_page_view: false });

        // Load the GTM container — it fires Clarity, Google Ads, Call-Tracking,
        // Meta Pixels, and the CAPI builder through their GTM tags.
        // Nothing else may self-inject on load (Clarity removed from inline code).
        (function(w,d,s,l,i){
          w[l]=w[l]||[]; w[l].push({'gtm.start':Date.now(),event:'gtm.js'});
          var f=d.getElementsByTagName(s)[0],j=d.createElement(s);
          j.async=true; j.src='https://www.googletagmanager.com/gtm.js?id='+i;
          f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GT-55BFZCQT');

        // Fredoka font — decorative/below-fold, load after idle so it never blocks LCP
        (function() {
          var fl = document.createElement('link');
          fl.rel = 'stylesheet';
          fl.href = 'https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap';
          document.head.appendChild(fl);
        })();
      }
    </script>
    <!-- End Analytics Code -->
  </head>
  <body>
    <!-- GTM noscript removed -->
    <!-- Keep the markup inert on non-home routes so the preload scanner cannot
         fetch the home hero there. On home, clone it before React mounts. -->
    <template id="static-lcp-hero-template">
      <div id="static-lcp-hero" aria-hidden="true">
        <img src="/images/optimized/hero-banner-1.webp"
             srcset="/images/optimized/hero-banner-1-480w.webp 480w, /images/optimized/hero-banner-1-640w.webp 640w, /images/optimized/hero-banner-1-828w.webp 828w, /images/optimized/hero-banner-1.webp 1200w"
             sizes="100vw"
             alt="" width="1200" height="675" fetchpriority="high" decoding="async" />
        <div class="ov1"></div>
        <div class="ov2"></div>
      </div>
    </template>
    <script>
      if (window.location.pathname === "/") {
        var heroTemplate = document.getElementById("static-lcp-hero-template");
        document.body.insertBefore(heroTemplate.content.cloneNode(true), heroTemplate);
        heroTemplate.remove();
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
