      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      function gtagSendEvent(url) {
        var callback = function () {

      function scheduleAnalytics() {

      function setupAnalyticsSchedule() {
        if ('requestIdleCallback' in window) {

          setTimeout(scheduleAnalytics, 1500);
        }
        // Also load on first user interaction to avoid missing fast-bounce events
        ['pointerdown','keydown','touchstart','scroll'].forEach(function(evt) {
          document.addEventListener(evt, scheduleAnalytics, { once: true, passive: true, capture: true });
        });
      }
      if (document.readyState === 'complete') {
        setupAnalyticsSchedule();
      } else {
        window.addEventListener('load', setupAnalyticsSchedule);
      }
      
      function loadAnalytics() {
