    <!-- Capture attribution for first-party forms, then remove query strings
         before any third-party analytics can inspect the browser URL. -->
    <script id="campaign-attribution-url-scrubber">
      (function () {
        var keys = ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term", "gclid", "gad_source", "gbraid", "wbraid", "fbclid", "msclkid"];
        var incoming = new URLSearchParams(window.location.search);
        var values = {};
        keys.forEach(function (key) {
          var value = incoming.get(key);
          if (value) values[key] = value.trim().replace(/[\u0000-\u001f\u007f]/g, "").slice(0, 200);
        });
        try {
          if (Object.keys(values).length) {
            sessionStorage.setItem("rainbow_campaign_attribution", JSON.stringify({
              capturedAt: Date.now(),
              values: values
            }));
          }
        } catch (_) {}
        if (window.location.search) {
          window.history.replaceState(window.history.state, "", window.location.pathname + window.location.hash);
        }
      })();
    </script>

    <!-- Fonts: display=optional prevents a very late swap on slow mobile
         connections. The @font-face metric overrides in index.css keep the
         fallback close to Poppins when the web font arrives promptly.
         Poppins 800 is loaded because the hero uses font-extrabold.
         The woff2 preload below fetches the Poppins 700 Latin file directly
         so it arrives in the same network round-trip as the CSS, eliminating
         the two-hop delay (CSS → then font) that caused swap-visible CLS. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/poppins/v24/pxiByp8kv8JHgFVrLCz7Z1xlFd2JQEk.woff2">
    <!-- Above-fold fonts only (Inter + Poppins). Fredoka is decorative/below-fold — loaded deferred via loadAnalytics() -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700;800&display=optional" onload="this.onload=null;this.rel='stylesheet'">

    <!-- Defer the GTM download, but queue GA4 configuration and events immediately. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('config', 'G-G1MX1N0M05', { send_page_view: false });
      
      function gtagSendEvent(url) {
        var callback = function () {
          if (typeof url === 'string') {
            window.location = url;
          }
        };
        gtag('event', 'conversion_event_submit_lead_form', {
          'event_callback': callback,
          'event_timeout': 2000,
        });
        return false;
      }
      
      // The first interaction or the fallback timer loads GTM; events queued
      // in dataLayer before then are processed when the container arrives.
      var analyticsLoaded = false;
      function scheduleAnalytics() {
        if (analyticsLoaded) return;
        analyticsLoaded = true;
        loadAnalytics();
      }
      window.loadDeferredAnalytics = scheduleAnalytics;
      var comparisonPage = window.location.pathname === '/top-preschools-in-thane';
      var interactionEvents = ['pointerdown','keydown','touchstart','scroll'];
      if (comparisonPage) {
        // Register now: a visitor can interact before the window load event.
        interactionEvents.forEach(function(evt) {
          document.addEventListener(evt, scheduleAnalytics, { once: true, passive: true, capture: true });
        });
      }
      function setupAnalyticsSchedule() {
        if (comparisonPage) {
          // Guaranteed fallback for a visitor who does not interact.
          setTimeout(scheduleAnalytics, 3500);
        } else {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(scheduleAnalytics, { timeout: 3500 });
          } else {
            setTimeout(scheduleAnalytics, 1500);
          }
          interactionEvents.forEach(function(evt) {
            document.addEventListener(evt, scheduleAnalytics, { once: true, passive: true, capture: true });
          });
        }
      }
      if (document.readyState === 'complete') {
        setupAnalyticsSchedule();
      } else {
        window.addEventListener('load', setupAnalyticsSchedule);
      }
      
      function loadAnalytics() {
        // Load the GTM container — it fires Clarity, Google Ads, Call-Tracking,
        // Meta Pixels, and the CAPI builder through their GTM tags.
        // Nothing else may self-inject on load (Clarity removed from inline code).
        (function(w,d,s,l,i){
          w[l]=w[l]||[]; w[l].push({'gtm.start':Date.now(),event:'gtm.js'});
          var f=d.getElementsByTagName(s)[0],j=d.createElement(s);
          j.async=true; j.src='https://www.googletagmanager.com/gtm.js?id='+i;
          f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GT-55BFZCQT');

        // Fredoka font — decorative/below-fold, load after idle so it never blocks LCP
        (function() {
          var fl = document.createElement('link');
          fl.rel = 'stylesheet';
          fl.href = 'https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap';
          document.head.appendChild(fl);
        })();
      }
    </script>
